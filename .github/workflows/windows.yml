# Windows: SwiftPM builds PokeWalker.exe and runs its self-test; the artifact is a folder to unzip and run (exe + the Swift runtime DLLs it loads + Resources).
name: windows
on:
  push:
    branches: [win-port]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1.2-release   # the Mac's compiler (Apple Swift 6.1.2)
          swift-build: 6.1.2-RELEASE
      - run: swift build -c release
      - name: Resources next to the exe
        run: |
          New-Item -ItemType Directory -Force .build\release\Resources | Out-Null
          Copy-Item Resources\*.bin, Resources\fonts\*.ttf .build\release\Resources
      - name: Package (the exe, the DLLs it loads from the Swift runtime + the VC runtime, Resources)
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          $rt = Split-Path (where.exe swiftCore.dll | Select-Object -First 1)
          $out = "dist\PokeWalker"; New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item .build\release\PokeWalker.exe, .build\release\Resources $out -Recurse
          $queue = [System.Collections.Queue]::new(); $queue.Enqueue("$out\PokeWalker.exe"); $seen = @{}
          while ($queue.Count) {
            $deps = & $dumpbin /nologo /dependents $queue.Dequeue() | ForEach-Object { if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1] } }
            foreach ($dll in $deps) {
              if ($seen[$dll]) { continue }; $seen[$dll] = $true
              $from = @("$rt\$dll", "$env:SystemRoot\System32\$dll") | Where-Object { Test-Path $_ } | Select-Object -First 1
              if ($from -and ($from.StartsWith($rt) -or $dll -match '^(vcruntime|msvcp)')) { Copy-Item $from $out; $queue.Enqueue("$out\$dll") }
            }
          }
          Get-ChildItem $out | Format-Table Name, Length
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"                     # no toolchain on the PATH: the folder must start on its own
          # a window app (no console): its output through a redirect, Start-Process waits for it
          $p = Start-Process "$out\PokeWalker.exe" -ArgumentList '--selftest' -NoNewWindow -Wait -PassThru -RedirectStandardOutput selftest.txt -RedirectStandardError selftest.err
          Get-Content selftest.txt -Encoding utf8; Get-Content selftest.err
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - name: Render (representative screens through the software canvas, to set beside the Mac's)
        run: |
          $p = Start-Process dist\PokeWalker\PokeWalker.exe -ArgumentList '--render', 'renders' -NoNewWindow -Wait -PassThru -RedirectStandardOutput render.txt -RedirectStandardError render.err
          Get-Content render.txt; Get-Content render.err
          if ($p.ExitCode -ne 0) { throw "render failed ($($p.ExitCode))" }
      - name: Smoke (the app itself starts and stays up; the runner's desktop shot as it opens, after a click on 메뉴, with its right-click menu)
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll")] public static extern IntPtr FindWindow(string c, string n);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);
            public struct RECT { public int L, T, R, B; }
          }
          "@
          New-Item -ItemType Directory -Force renders\smoke | Out-Null
          function Shot($name) {
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size, [System.Drawing.CopyPixelOperation]::SourceCopy -bor [System.Drawing.CopyPixelOperation]::CaptureBlt)
              $bmp.Save("renders\smoke\$name.png")
            } catch { Write-Host "no screenshot: $_" }
          }
          function Click($x, $y, $down, $up) { [W]::SetCursorPos($x, $y) | Out-Null; [W]::mouse_event($down, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 60; [W]::mouse_event($up, 0, 0, 0, [UIntPtr]::Zero) }
          $p = Start-Process dist\PokeWalker\PokeWalker.exe -PassThru
          Start-Sleep 6
          if ($p.HasExited) { throw "the app quit on its own ($($p.ExitCode))" }
          $h = [W]::FindWindow("PokeWalker", $null); $r = New-Object W+RECT; [W]::GetWindowRect($h, [ref]$r) | Out-Null
          $k = ($r.R - $r.L) / 216; Write-Host "card at $($r.L),$($r.T) $($r.R - $r.L) x $($r.B - $r.T) (x$k)"
          Shot "1_open"
          Click ([int]($r.L + 19 * $k)) ([int]($r.T + 176 * $k)) 2 4; Start-Sleep 2; Shot "2_menu_key"
          [W]::GetWindowRect($h, [ref]$r) | Out-Null; Write-Host "after 메뉴: $($r.R - $r.L) x $($r.B - $r.T)"
          Click ([int]($r.L + 108 * $k)) ([int]($r.T + 100 * $k)) 8 16; Start-Sleep 2; Shot "3_right_click"
          [System.Windows.Forms.SendKeys]::SendWait("{ESC}"); Start-Sleep 1
          if ($p.HasExited) { throw "the app quit after the clicks ($($p.ExitCode))" }
          Get-Content "$env:APPDATA\PokeWalker\settings.json" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:APPDATA\PokeWalker" | Format-Table Name, Length
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: PokeWalker-windows-x64
          path: dist/PokeWalker
      - uses: actions/upload-artifact@v4
        with:
          name: PokeWalker-renders
          path: renders
